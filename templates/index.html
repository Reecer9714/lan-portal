<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1120">
    <title>{{TITLE}}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main>
        <header class="page-header">
            <div class="header-copy">
                <div class="eyebrow">LAN Portal</div>
                <h1>{{TITLE}}</h1>
                <p class="subtitle">{{SUBTITLE}}</p>
            </div>
            <button class="add-service-button" id="add-service" type="button">
                <span class="button-icon" aria-hidden="true">+</span>
                Add Service
            </button>
        </header>

        <section class="services" aria-label="Services">
            {{SERVICES}}
        </section>

        <footer>Local services directory</footer>
    </main>

    <dialog id="service-dialog" class="service-dialog">
        <form id="service-form" class="service-form">
            <div class="dialog-header">
                <div>
                    <div class="eyebrow">New Shortcut</div>
                    <h2>Add Service</h2>
                </div>
                <button class="icon-button" id="close-service" type="button" aria-label="Close">&times;</button>
            </div>

            <div class="form-grid">
                <label class="form-field">
                    <span>Name <strong>Required</strong></span>
                    <input name="name" required autocomplete="off" placeholder="Jellyseerr">
                </label>

                <label class="form-field">
                    <span>Path <strong>Required</strong></span>
                    <input name="path" required autocomplete="off" placeholder="jellyseerr" pattern="[A-Za-z0-9-]+">
                    <small>Auto-filled from name and used as /jellyseerr</small>
                </label>

                <label class="form-field">
                    <span>Host <em>Optional</em></span>
                    <input name="host" autocomplete="off" placeholder="Leave blank for this server">
                    <small>Optional IP address or hostname</small>
                </label>

                <label class="form-field">
                    <span>Port <strong>Required</strong></span>
                    <input name="port" type="number" min="1" max="65535" required placeholder="5055">
                </label>

                <label class="form-field form-field-wide">
                    <span>Description <em>Optional</em></span>
                    <input name="description" autocomplete="off" placeholder="Media requests">
                </label>

                <label class="form-field form-field-wide">
                    <span>Icon <em>Optional</em></span>
                    <div class="icon-picker">
                        <div class="icon-input-row">
                            <div class="icon-preview" id="icon-preview" aria-hidden="true">&#9672;</div>
                            <input name="icon" id="service-icon-input" autocomplete="off" placeholder="Choose or type a Unicode icon" maxlength="4">
                        </div>
                        <small>Used only if LAN Portal cannot capture a favicon from the target service.</small>
                        <div class="icon-picker-tools">
                            <input id="unicode-icon-search" type="search" autocomplete="off" placeholder="Search icons, names, or U+ codes">
                            <div class="icon-page-controls" aria-label="Unicode icon pages">
                                <button class="secondary-button icon-page-button" id="icon-page-prev" type="button">Previous</button>
                                <span class="icon-page-status" id="icon-page-status" aria-live="polite"></span>
                                <button class="secondary-button icon-page-button" id="icon-page-next" type="button">Next</button>
                            </div>
                        </div>
                        <div class="unicode-icon-grid" id="unicode-icon-grid" aria-label="Unicode icon choices"></div>
                    </div>
                </label>

                <label class="form-field">
                    <span>Protocol <strong>Required</strong></span>
                    <select name="scheme">
                        <option value="http">HTTP</option>
                        <option value="https">HTTPS</option>
                    </select>
                </label>
            </div>

            <div id="form-error" class="form-error" role="alert" hidden></div>

            <div class="dialog-actions">
                <button class="secondary-button" id="cancel-service" type="button">Cancel</button>
                <button class="primary-button" type="submit">Add Service</button>
            </div>
        </form>
    </dialog>
</body>
</html>
